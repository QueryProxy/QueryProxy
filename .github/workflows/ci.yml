name: CI

# Actions are pinned to commit SHAs rather than mutable tags: a moved tag would
# get to run arbitrary code in a job that checks out the repository. Dependabot
# (github-actions ecosystem) keeps the SHAs current; when bumping one,
# re-resolve the SHA — never edit the version comment alone.

on:
  push:
    branches: [main]
  pull_request:

# A newer run on the same ref cancels the older one for pull requests only;
# pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read the repository; nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config, where the dependency
          # install steps that follow could read it.
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Dependency vulnerability audit
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

  # Matrix jobs report as "test (8.3)", "test (8.4)", ... so branch protection
  # requires the single `test` job below, which aggregates their result.
  tests:
    name: test (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config, where the dependency
          # install and build steps that follow could read it.
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Tests
        run: ./vendor/bin/pest --ci

      # One matrix leg is enough: the exposition does not depend on the PHP
      # version. The test writes a scrape of /metrics (every family with a
      # value) to the file; promtool, run from its official image, lints it.
      # The image is pinned by digest (the multi-arch index of v2.55.1), like
      # the actions above; to bump it, re-resolve the digest of the new tag
      # (docker buildx imagetools inspect prom/prometheus:<tag>) - never edit
      # the tag alone. Dependabot does not watch this line.
      - name: Prometheus exposition format (promtool)
        if: ${{ matrix.php == '8.5' }}
        env:
          QUERYPROXY_METRICS_DUMP: ${{ runner.temp }}/metrics.txt
        run: |
          ./vendor/bin/pest --ci --filter='dumped for promtool'
          docker run --rm -i --entrypoint promtool prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3 check metrics < "$QUERYPROXY_METRICS_DUMP"

  test:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        run: test "${{ needs.tests.result }}" = "success"
