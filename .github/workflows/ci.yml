name: CI

# Actions are pinned to commit SHAs rather than mutable tags: a moved tag would
# get to run arbitrary code in a job that checks out the repository. Dependabot
# (github-actions ecosystem) keeps the SHAs current; when bumping one,
# re-resolve the SHA — never edit the version comment alone.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Dependency vulnerability audit
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

      - name: Tests
        run: ./vendor/bin/pest --ci
