name: Docker Hub description

# Keeps the Docker Hub overview (docker.io/queryproxy/queryproxy) in sync with
# README.md. Runs on demand and whenever the README changes on main, so the
# overview no longer has to wait for the next release tag.
#
# Needs DOCKERHUB_USERNAME and a DOCKERHUB_TOKEN with *read/write/delete* scope.
# A read/write token can push images but gets 403 Forbidden from the description
# endpoint, and the account must have Admin permission on the repository.
#
# Operator note: give this workflow its own Docker Hub access token, separate
# from the one release.yml pushes with, and scope that token to this repository
# only. The token is handed to a third-party action as a plain input, so it is
# readable by whatever code that action runs; a delete-capable token shared with
# the release pipeline would turn one compromised action into image deletion.
# Rotate it independently of the push token.
#
# The action is pinned to a commit SHA rather than a mutable tag so a moved tag
# cannot silently replace the code that receives that token. Dependabot
# (github-actions ecosystem) keeps the SHA current; when bumping it, re-resolve
# the SHA — never edit the version comment alone.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: queryproxy/queryproxy
          # Docker Hub truncates this at 100 bytes, so it is written short
          # rather than borrowed from the GitHub description (163 chars) and
          # cut mid-sentence.
          short-description: "Self-hosted DB access control: guarded SQL, DBA approvals from Slack, masked audited results"
          # Rewrites the README's relative links and screenshot paths to
          # absolute GitHub URLs; they 404 on Docker Hub otherwise.
          enable-url-completion: true
