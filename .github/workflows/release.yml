name: Release image

# Pushing a vX.Y.Z tag publishes the container image to both registries:
#   docker.io/queryproxy/queryproxy:<version> and :latest
#   ghcr.io/queryproxy/queryproxy:<version> and :latest
# (:latest only for a stable tag, never for a pre-release such as v1.2.0-rc.1)
# plus the SQL Server variant, which carries the Microsoft ODBC driver and
# pdo_sqlsrv (Dockerfile build arg INSTALL_SQLSRV=1):
#   <registry>/queryproxy/queryproxy:<version>-mssql and :mssql
# (:mssql likewise only for a stable tag). The two variants are the legs of the
# `image` job's matrix; each is scanned, signed and verified on its own.
# Once both are out, the GitHub Release is created from that version's
# CHANGELOG.md section.
#
# The Helm chart is published as an OCI artifact by the `chart` job:
#   oci://ghcr.io/queryproxy/charts/queryproxy:<version>
# The tag must equal the version and appVersion in Chart.yaml, and the chart's
# digest is signed keyless with cosign like the images.
#
# Docker Hub needs two repository secrets: DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (an access token with Read/Write scope on the
# queryproxy/queryproxy repository).
#
# The Docker Hub overview text is not published here — see
# dockerhub-description.yml, which needs a wider token scope than pushing does.
#
# Every published image is signed keyless with cosign (Sigstore, GitHub OIDC
# identity) and carries an SBOM and max-detail SLSA provenance attestation as
# BuildKit attestations on the image index. Verification commands are in
# SECURITY.md.
#
# Every third-party action is pinned to a commit SHA rather than a mutable tag:
# these steps run in the same job as the registry logins, so a moved tag would
# be able to read the credentials that login-action writes to the runner's
# ~/.docker/config.json. Dependabot (github-actions ecosystem) keeps the SHAs
# current. When bumping one, re-resolve the SHA — never edit the comment alone.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  # Fails a release whose tag does not match the chart before anything is built
  # or pushed: the image job waits for this job. The version is the release tag
  # without the leading v; Chart.yaml version and appVersion are bumped by hand
  # before tagging. A tag that fails the tag regexp is refused here too, so no
  # chart can be published that the certificate identity below would not accept.
  chart-version:
    name: chart version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against Chart.yaml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-<pre-release>; nothing is published."
            exit 1
          fi
          version="${TAG#v}"
          chart_version=$(awk '/^version:/ { gsub(/["\047]/, "", $2); print $2; exit }' deploy/helm/queryproxy/Chart.yaml)
          app_version=$(awk '/^appVersion:/ { gsub(/["\047]/, "", $2); print $2; exit }' deploy/helm/queryproxy/Chart.yaml)
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::Tag $TAG needs Chart.yaml version and appVersion to be $version (found version=$chart_version, appVersion=$app_version); nothing is published."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.variant }})
    # Nothing is built or pushed for a tag whose Chart.yaml was not bumped.
    needs: chart-version
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      # A failed leg must not cut the other one off halfway through a push.
      fail-fast: false
      matrix:
        include:
          - variant: default
            build-args: ''
            # The cache scope the workflow used before it had a matrix.
            cache-scope: buildkit
          - variant: mssql
            build-args: INSTALL_SQLSRV=1
            cache-scope: mssql
    # id-token: write is what lets cosign obtain the short-lived Sigstore
    # certificate for the keyless signature; it is granted to this job only.
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # The tag glob above is looser than the certificate identity that
      # SECURITY.md (and the verify step below) accept. Refuse any other tag
      # before building, so an image users could not verify is never pushed.
      # The regexp has three copies: SECURITY.md, this step and the verify
      # step below. Change them together.
      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-<pre-release>; nothing is published."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build a local single-arch image first so it can be vulnerability-scanned
      # before anything is published. Both this build and the scan run *before*
      # the registry logins: nothing here needs a credential, so the runner has
      # no push token on disk while they execute.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: queryproxy-scan:candidate
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Scan image for vulnerabilities
        # Pinned to the commit behind v0.36.0: the unprefixed tags (0.28.0)
        # were removed upstream and no longer resolve.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: queryproxy-scan:candidate
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        if: matrix.variant == 'default'
        # latest comes from metadata-action's default flavor (latest=auto): it
        # is added only for a stable semver tag. A pre-release (vX.Y.Z-rc.1)
        # gets its version tag only, since semver also skips {{major}}.{{minor}}.
        with:
          images: |
            queryproxy/queryproxy
            ghcr.io/queryproxy/queryproxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The SQL Server variant has its own tags and never takes `latest`.
      # :mssql follows the newest stable release; a pre-release tag always
      # contains a hyphen (the tag guard above), so it gets its version tag only.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-mssql
        if: matrix.variant == 'mssql'
        with:
          images: |
            queryproxy/queryproxy
            ghcr.io/queryproxy/queryproxy
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-mssql
            type=raw,value=mssql,enable=${{ !contains(github.ref_name, '-') }}

      # Microsoft ships its ODBC driver for Alpine on amd64 and arm64, so both
      # variants are multi-arch.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags || steps.meta-mssql.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels || steps.meta-mssql.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the pushed digest, not a tag: tags move, a digest does not. The
      # same digest is published to both registries, so each repository gets
      # its own signature for it. The identity recorded in the certificate is
      # this workflow at this tag ref.
      - name: Sign the published image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "queryproxy/queryproxy@${DIGEST}" \
            "ghcr.io/queryproxy/queryproxy@${DIGEST}"

      # Verify the signature just made with the same command SECURITY.md gives
      # users, so that command is proven on every release. Keep the identity
      # regexp identical to SECURITY.md and the tag guard at the top of this
      # job. A failure here fails the job, and the release job (needs: [image, chart])
      # then publishes nothing.
      - name: Verify the published image signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/QueryProxy/QueryProxy/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "queryproxy/queryproxy@${DIGEST}" \
            "ghcr.io/queryproxy/queryproxy@${DIGEST}"

  # Publishes the Helm chart (deploy/helm/queryproxy) as a signed OCI artifact.
  # It waits for the images so a chart is never available before the image its
  # appVersion points at; the tag/Chart.yaml check is the `chart-version` job.
  # Tag pushes are the only trigger of this workflow; the
  # `if` repeats that on the job itself. The registry write permission and the
  # OIDC token for the keyless signature are declared on the job, as on `image`.
  chart:
    name: chart (OCI)
    needs: [image, chart-version]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Package the chart
        env:
          VERSION: ${{ needs.chart-version.outputs.version }}
        run: |
          helm lint deploy/helm/queryproxy
          helm package deploy/helm/queryproxy --destination "$RUNNER_TEMP/chart"
          test -f "$RUNNER_TEMP/chart/queryproxy-${VERSION}.tgz"

      # helm and cosign keep their registry credentials in different files:
      # helm in its own registry config, cosign in ~/.docker/config.json.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log helm in to ghcr.io
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin

      # `helm push` prints the digest of what it pushed; that digest, not the
      # tag, is what gets signed. pipefail keeps a failed push from being
      # hidden by tee. The first push of a new GHCR package is private: set
      # its visibility to public (and link the repository) once, then check
      # `helm pull` and `cosign verify` without logging in.
      - name: Push the chart
        id: push
        env:
          VERSION: ${{ needs.chart-version.outputs.version }}
        run: |
          set -o pipefail
          helm push "$RUNNER_TEMP/chart/queryproxy-${VERSION}.tgz" oci://ghcr.io/queryproxy/charts 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest=$(awk '/^Digest:/ { print $2; exit }' "$RUNNER_TEMP/helm-push.log")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the chart digest from helm push output."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Same keyless signing as the images; the identity recorded in the
      # certificate is this workflow at this tag ref.
      - name: Sign the published chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/queryproxy/charts/queryproxy@${DIGEST}"

      # The same command as in deploy/helm/queryproxy/README.md, so it is
      # proven on every release. Keep the identity regexp identical to
      # SECURITY.md and the tag guards in this file.
      - name: Verify the published chart signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/QueryProxy/QueryProxy/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/queryproxy/charts/queryproxy@${DIGEST}"

  # Publishes the GitHub Release once the image is out, using the tag's
  # section of CHANGELOG.md as the release notes.
  release:
    needs: [image, chart]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v v="${VERSION#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION#v}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it untouched."
          else
            gh release create "$VERSION" --title "QueryProxy $VERSION" --notes-file release-notes.md --verify-tag
          fi
