name: Release image

# Pushing a v* tag publishes the container image to both registries:
#   docker.io/queryproxy/queryproxy:<version> and :latest
#   ghcr.io/queryproxy/queryproxy:<version> and :latest
#
# Docker Hub needs two repository secrets: DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (an access token with Read/Write scope on the
# queryproxy/queryproxy repository).

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            queryproxy/queryproxy
            ghcr.io/queryproxy/queryproxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build a local single-arch image first so it can be vulnerability-scanned
      # before anything is published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: queryproxy-scan:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        # Pinned to a v-prefixed tag: the unprefixed ones (0.28.0) were
        # removed upstream and no longer resolve.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: queryproxy-scan:candidate
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keeps the Docker Hub overview in sync with the repository README.
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: queryproxy/queryproxy
          short-description: ${{ github.event.repository.description }}
