name: Release image

# Pushing a v* tag publishes the container image to both registries:
#   docker.io/queryproxy/queryproxy:<version> and :latest
#   ghcr.io/queryproxy/queryproxy:<version> and :latest
#
# Docker Hub needs two repository secrets: DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (an access token with Read/Write scope on the
# queryproxy/queryproxy repository).
#
# The Docker Hub overview text is not published here — see
# dockerhub-description.yml, which needs a wider token scope than pushing does.
#
# Every third-party action is pinned to a commit SHA rather than a mutable tag:
# these steps run in the same job as the registry logins, so a moved tag would
# be able to read the credentials that login-action writes to the runner's
# ~/.docker/config.json. Dependabot (github-actions ecosystem) keeps the SHAs
# current. When bumping one, re-resolve the SHA — never edit the comment alone.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build a local single-arch image first so it can be vulnerability-scanned
      # before anything is published. Both this build and the scan run *before*
      # the registry logins: nothing here needs a credential, so the runner has
      # no push token on disk while they execute.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: queryproxy-scan:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        # Pinned to the commit behind v0.36.0: the unprefixed tags (0.28.0)
        # were removed upstream and no longer resolve.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: queryproxy-scan:candidate
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            queryproxy/queryproxy
            ghcr.io/queryproxy/queryproxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
