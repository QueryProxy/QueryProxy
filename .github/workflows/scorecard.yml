name: Scorecard

# OpenSSF Scorecard supply-chain security analysis. It runs on a weekly
# schedule, on pushes to main and whenever branch protection rules change, and
# publishes the result to the OpenSSF public API (which backs the Scorecard
# badge) and to the repository's code scanning alerts.
#
# Actions are pinned to commit SHAs rather than mutable tags, as in the other
# workflows. Dependabot (github-actions ecosystem) keeps the SHAs current;
# when bumping one, re-resolve the SHA — never edit the version comment alone.

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]

# Read-only at the top level; the job below adds only the write scopes it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results to the OpenSSF API and the badge (OIDC).
      id-token: write
      # Needed by Scorecard to read workflow and repository metadata.
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
