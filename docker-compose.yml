# Zero-config: `docker compose up` boots the portal on http://localhost:7432
# with a SQLite application database and a database-backed queue (ADR-002).
#
# APP_KEY: set one explicitly for production (`php artisan key:generate --show`).
# Without it, a key is generated once and persisted on the database volume so
# app/worker/scheduler always share the same key.
#
# Demo data is OFF by default. To try the demo accounts on a non-production
# instance, set QUERYPROXY_SEED_DEMO=true (and QUERYPROXY_SEED_DEMO_FORCE=true
# if APP_ENV stays "production"); the generated demo password is printed once
# in the app container logs.

services:
  app:
    build: .
    ports:
      - "7432:7432"
    environment: &env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:7432
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      # Must stay above the worker --timeout (310s) so a slow query is never
      # re-reserved and executed twice.
      DB_QUEUE_RETRY_AFTER: "330"
      QUERYPROXY_SEED_DEMO: "false"
      # Uncomment when serving over HTTPS (behind a TLS-terminating proxy):
      # SESSION_SECURE_COOKIE: "true"
    volumes:
      - app-database:/var/www/html/database
      - app-storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7432/up"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: php artisan queue:work --queue=queries,default --tries=1 --timeout=310
    environment: *env
    volumes:
      - app-database:/var/www/html/database
      - app-storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: php artisan schedule:work
    environment: *env
    volumes:
      - app-database:/var/www/html/database
      - app-storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-database:
  app-storage:

# --- Using MySQL or PostgreSQL for the application database instead ---
# 1. Uncomment the service below and the depends_on entries you need.
