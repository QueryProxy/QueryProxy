apiVersion: v1
kind: Service
metadata:
  name: {{ include "queryproxy.fullname" . }}
  labels:
    {{- include "queryproxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "queryproxy.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
