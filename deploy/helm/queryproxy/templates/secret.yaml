{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "queryproxy.secretName" . }}
  labels:
    {{- include "queryproxy.labels" . | nindent 4 }}
  annotations:
    # Holds the APP_KEY: keep it on uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- include "queryproxy.secretData" . | nindent 2 }}
{{- if eq (include "queryproxy.usesMigrationHook" .) "true" }}
---
# The migration Job runs before the Secret above exists on a first install, so
# it reads this copy (same data, same generated APP_KEY). Hook resources are not
# part of the release (no rollback or ownership effects); Helm removes this one
# once the hook has finished.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "queryproxy.migrationSecretName" . }}
  labels:
    {{- include "queryproxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- include "queryproxy.secretData" . | nindent 2 }}
{{- end }}
{{- end }}
