# Throwaway database servers for the integration tests (tests/Integration,
# Pest group "integration", and the "live-appdb" audit tests). Test-only:
# fixed credentials, every port bound to 127.0.0.1 and chosen so as not to
# collide with a local database. CI (.github/workflows/integration.yml) uses
# this same file, one driver per job.
#
# Besides the main server of each driver there is a second one, so that the
# TLS tests have a server that offers TLS and one that does not:
#
#   driver    main server (functional tests)        second server
#   pgsql     pgsql         15432  no TLS           pgsql-tls     15433  TLS
#   mysql     mysql         13306  TLS (self-made)  mysql-notls   13307  no TLS
#   mariadb   mariadb       13316  no TLS           mariadb-tls   13317  TLS
#   sqlsrv    mssql         11433  TLS (self-signed), no way to switch it off
#
# PostgreSQL-compatible systems, tested through the pgsql driver
# (work item 040-11, docs/compatibility.md; QUERYPROXY_IT_FLAVOR names them):
#
#   flavor       main server (functional tests)         second server
#   cockroachdb  cockroachdb       16257  TLS, passwords   cockroachdb-notls  16258  insecure, no TLS
#   yugabytedb   yugabytedb        15434  no TLS, passwords  (none: see the service)
#
# The `cockroachdb` service needs the node and client certificates the same
# script writes (a secure single node insists on CN=node).
#
# The `vault` service (dev-mode HashiCorp Vault, 18200) is not a database: it is
# the secret store of tests/Integration/VaultSecretTest.php (ADR-028).
#
# MariaDB runs on two LTS lines. This file holds 11.4; 11.8 has the same pair of
# servers in its own file, tests/Integration/docker/mariadb-11-8/docker-compose.yml
# (ports 13318 no TLS, 13319 TLS), which is used on its own, never merged with
# this one. They are two files so Dependabot sees two image dependencies and
# keeps each line on its own patch releases (it merges equal image names of one
# directory into a single dependency based on the lower version).
#
# The TLS servers need the certificates of tests/Integration/docker/ first:
#
#   tests/Integration/docker/generate-certs.sh
#   docker compose -f docker-compose.integration.yml up -d --wait pgsql pgsql-tls
#   QUERYPROXY_IT_DRIVER=pgsql QUERYPROXY_IT_HOST=127.0.0.1 QUERYPROXY_IT_PORT=15432 \
#   QUERYPROXY_IT_DATABASE=queryproxy_test QUERYPROXY_IT_USERNAME=queryproxy_test \
#   QUERYPROXY_IT_PASSWORD=queryproxy_test \
#   QUERYPROXY_IT_TLS_OFF_PORT=15432 QUERYPROXY_IT_TLS_ON_PORT=15433 \
#   QUERYPROXY_IT_TLS_CA=tests/Integration/docker/certs/ca.crt \
#   ./vendor/bin/pest --group=integration
#   docker compose -f docker-compose.integration.yml down
#
# Images are pinned to a version and a digest so a new release cannot turn the
# jobs red without a change here; Dependabot (docker-compose ecosystem) bumps
# them. Whether a server really offers TLS is asserted by the TLS tests
# themselves (they read the server's greeting), not taken from this file.
#
# The per-driver variables are listed in tests/Integration/IntegrationTarget.php.
# The tests need a login that may create tables and logins/users and signal
# other sessions, so the servers' administrator account is used (root, sa, a
# PostgreSQL superuser).

services:
  pgsql:
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_DB: queryproxy_test
      POSTGRES_USER: queryproxy_test
      POSTGRES_PASSWORD: queryproxy_test
      PGPORT: "5432"
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      # TCP on purpose: during initdb the temporary server answers on the
      # socket only, and the container would be reported healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U queryproxy_test -d queryproxy_test"]
      interval: 2s
      timeout: 3s
      retries: 40

  pgsql-tls:
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    # PostgreSQL refuses a key file it does not own or that others can read,
    # and a bind-mounted file keeps the owner of the host. So the key is copied
    # to a place the server owns before the stock entrypoint starts it.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /tls &&
        cp /certs/server.crt /certs/server.key /tls/ &&
        chown postgres:postgres /tls/server.crt /tls/server.key &&
        chmod 600 /tls/server.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
    environment:
      POSTGRES_DB: queryproxy_test
      POSTGRES_USER: queryproxy_test
      POSTGRES_PASSWORD: queryproxy_test
      PGPORT: "5432"
    volumes:
      - ./tests/Integration/docker/certs:/certs:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U queryproxy_test -d queryproxy_test"]
      interval: 2s
      timeout: 3s
      retries: 40

  mysql:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    # MySQL generates a self-signed certificate on first start and offers TLS
    # by default. Its default login plugin (caching_sha2_password) needs TLS
    # for the first login of an account, so the functional tests use it too.
    environment:
      MYSQL_ROOT_PASSWORD: queryproxy_test
      MYSQL_DATABASE: queryproxy_test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pqueryproxy_test --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  mysql-notls:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    # An empty tls_version leaves the server without any TLS protocol, so it
    # starts with encrypted connections disabled (MySQL 8.4 manual, "Server-Side
    # Configuration for Encrypted Connections").
    command: ["--tls-version="]
    environment:
      MYSQL_ROOT_PASSWORD: queryproxy_test
      MYSQL_DATABASE: queryproxy_test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:13307:3306"
    healthcheck:
      # No login in the check: over TCP without TLS the first login of a
      # caching_sha2_password account is refused ("Authentication requires
      # secure connection"), so mysqladmin ping reports this server unhealthy
      # although it runs. The port only opens once the real server is up (the
      # server of the initialisation phase has networking off).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3306'"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    # MariaDB 11.4 turns TLS on by itself (it makes a self-signed certificate
    # when none is given), so the server meant to have none has to say so.
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    command: ["--skip-ssl"]
    environment:
      MARIADB_ROOT_PASSWORD: queryproxy_test
      MARIADB_DATABASE: queryproxy_test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb-tls:
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    command:
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    environment:
      MARIADB_ROOT_PASSWORD: queryproxy_test
      MARIADB_DATABASE: queryproxy_test
    volumes:
      - ./tests/Integration/docker/certs:/certs:ro
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:13317:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    # SQL Server always generates a self-signed certificate at start-up and
    # encrypts when the client asks for it; there is no setting that makes it
    # refuse TLS, so there is no second "no TLS" server for this driver.
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "QueryProxy_test9!"
    ports:
      - "127.0.0.1:11433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b) >/dev/null
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  vault:
    # Dev mode: in-memory, unsealed, KV v2 mounted at secret/, and a fixed root
    # token. Test-only; never reachable beyond the loopback interface.
    image: hashicorp/vault:1.20.4@sha256:268bb80aa9c6d13d65fcfa05c0c268caca068952240a8087291a6ce0b66e3a10
    command: ["server", "-dev", "-dev-root-token-id=queryproxy-test-root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:18200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  cockroachdb:
    # Secure single node: TLS with the test CA, password logins. This is the
    # main CockroachDB server because an insecure one accepts no passwords at
    # all (no read-only login could be created on it) and offers no TLS.
    image: cockroachdb/cockroach:v25.4.19@sha256:5f4ea15c81baedabf439ce53fc3fd0793c4d577e4abe295e9343d765112ce199
    # The key files must not be readable by others, and a bind-mounted file keeps
    # the mode of the host, so the certificates are copied first.
    # --advertise-addr=localhost: with the default (0.0.0.0) the node cannot
    # dial itself and SHOW CLUSTER SESSIONS / STATEMENTS come back empty,
    # which is what the application reads to stop a statement.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /crt &&
        cp /certs/ca.crt /certs/node.crt /certs/node.key /certs/client.root.crt /certs/client.root.key /crt/ &&
        chmod 600 /crt/*.key &&
        exec cockroach start-single-node --certs-dir=/crt --advertise-addr=localhost
        --http-addr=127.0.0.1:8080 --cache=.25 --max-sql-memory=.25
    volumes:
      - ./tests/Integration/docker/certs:/certs:ro
    tmpfs:
      - /cockroach/cockroach-data
    ports:
      - "127.0.0.1:16257:26257"
    healthcheck:
      # Creates the test database and the administrator login on the way (all
      # idempotent), so "healthy" means the server is ready for the tests.
      test:
        - CMD-SHELL
        - >-
          cockroach sql --certs-dir=/crt --host=localhost -e
          "CREATE DATABASE IF NOT EXISTS queryproxy_test;
          CREATE USER IF NOT EXISTS queryproxy_test WITH PASSWORD 'queryproxy_test';
          GRANT admin TO queryproxy_test"
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 5s

  cockroachdb-notls:
    # Insecure mode: no TLS, and any password is accepted (it is never checked).
    image: cockroachdb/cockroach:v25.4.19@sha256:5f4ea15c81baedabf439ce53fc3fd0793c4d577e4abe295e9343d765112ce199
    command: ["start-single-node", "--insecure", "--advertise-addr=localhost", "--http-addr=127.0.0.1:8080", "--cache=.25", "--max-sql-memory=.25"]
    tmpfs:
      - /cockroach/cockroach-data
    ports:
      - "127.0.0.1:16258:26257"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cockroach sql --insecure --host=localhost -e
          "CREATE DATABASE IF NOT EXISTS queryproxy_test;
          CREATE USER IF NOT EXISTS queryproxy_test;
          GRANT admin TO queryproxy_test"
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 5s

  yugabytedb:
    # Single node (yugabyted), password logins switched on for YSQL: the
    # built-in administrator is `yugabyte` with the password `yugabyte`, in the
    # database `yugabyte`, so nothing has to be created first. YSQL listens on
    # the container's address only, hence `hostname -i` in the health check.
    # No TLS: client-to-server encryption needs a certificate directory laid
    # out the way YugabyteDB wants it, which this file does not set up; the TLS
    # tests are skipped for this flavor (docs/compatibility.md).
    image: yugabytedb/yugabyte:2025.2.8.0-b60@sha256:c77dfcd5e840e019af1ba96f7129db5f6a5de8b80b13f6c1450cce5246daa382
    command: ["bin/yugabyted", "start", "--background=false", "--tserver_flags=ysql_enable_auth=true"]
    ports:
      - "127.0.0.1:15434:5433"
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=yugabyte /home/yugabyte/bin/ysqlsh -h "$$(hostname -i)" -U yugabyte -d yugabyte -c "SELECT 1" >/dev/null
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
