; Pool overrides for the QueryProxy container (loaded after www.conf).
; The master process runs as www-data (no root), so the pool user/group
; directives from www.conf are ignored by FPM with a warning — harmless.
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; Config is cached at boot (config:cache), but keep env visible for anything
; that still reads it at runtime.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
