# Unprivileged nginx: runs as www-data, binds a non-privileged port and keeps
# every writable path (pid, temp buffers) under /tmp so no root is needed.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 60s;

    server {
        listen 7432;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Only the front controller is ever executed as PHP.
        location = /index.php {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_read_timeout 120s;

            # Overriding an HTTP_* parameter makes nginx drop the client's own
            # header of that name instead of forwarding it, so these never reach
            # PHP. None of them can be legitimate here: URLs come from APP_URL,
            # the app is served at the root, and there is no AWS load balancer.
            # A forged X-Forwarded-Host used to rewrite password-reset links.
            fastcgi_param HTTP_X_FORWARDED_HOST "";
            fastcgi_param HTTP_X_FORWARDED_PREFIX "";
            fastcgi_param HTTP_X_FORWARDED_AWS_ELB "";
            fastcgi_param HTTP_FORWARDED "";

            # X-Forwarded-For/-Proto/-Port are deliberately passed through: only a
            # real proxy in front of this container can set them meaningfully, and
            # nginx cannot tell one from a client that made them up. Laravel makes
            # that call instead — it ignores all of them unless TRUSTED_PROXIES
            # names the proxy, which is empty by default.
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
