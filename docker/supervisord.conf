[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# The image is self-contained: one `docker run` starts the web tier *and* the
# queue worker (approved queries execute there — ADR-002) and the scheduler
# (result retention pruning). Split deployments that run those as separate
# containers switch them off with QUERYPROXY_RUN_WORKER/_SCHEDULER=false.

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php artisan queue:work --queue=queries,default --tries=1 --timeout=310
directory=/var/www/html
autostart=%(ENV_QUERYPROXY_RUN_WORKER)s
autorestart=true
numprocs=%(ENV_QUERYPROXY_WORKER_PROCESSES)s
process_name=%(program_name)s_%(process_num)02d
; Give a running query the full execution timeout to finish before SIGKILL.
stopwaitsecs=320
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
autostart=%(ENV_QUERYPROXY_RUN_SCHEDULER)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
